schema_version: 1

context:
  name: qiskit-ibm-runtime
  version: 0.51.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 8873224137d4eb0e2187813252bc5e84ce73dfce7f17c954d25d51c74a6b4827

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=66.1.0
    - setuptools-scm >=8.1.0
  run:
    - ibm-platform-services >=0.61.1
    - numpy >=1.26.2
    - pydantic >=2.13.0
    - python >=${{ python_min }}
    - python-dateutil >=2.9.0
    - qiskit >=2.3.0,<3
    - requests >=2.32.4
    - requests_ntlm >=1.1.0
    - urllib3 >=2.4.0
    - pybase64 >=1.4.0
    - samplomatic >=0.21.0
    - ibm-quantum-schemas >=0.13.20261016,<1
    - scipy >=1.5.0
    - qiskit-mitigation >=0.1.1
tests:
  - python:
      imports:
        - qiskit_ibm_runtime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: IBM Quantum client for Qiskit Runtime.
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/Qiskit/qiskit-ibm-runtime

extra:
  recipe-maintainers:
    - wshanks
